<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIRECOMMAND">
  <meta name="format-detection" content="telephone=no">
  <title>FIRECOMMAND – Ressourcenübersicht</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="kopf">
    <div class="marke">
      <span class="marke-name">FIRECOMMAND</span>
      <span class="marke-sub">Ressourcenübersicht</span>
    </div>
    <div class="kopf-info">
      <span class="systemstatus" id="systemstatus" data-zustand="pruefen">
        <span class="punkt"></span><span class="text">Starte …</span>
      </span>
      <span class="aktualisiert" id="aktualisiert">–</span>
    </div>
    <div class="kopf-aktionen">
      <button class="knopf knopf-flach" id="btn-bearbeiter" type="button"></button>
      <button class="knopf knopf-flach" id="btn-sicherung" type="button">Sicherung</button>
    </div>
  </header>

  <div class="hinweisband" id="hinweisband" hidden></div>

  <main id="inhalt" class="inhalt" aria-live="polite">
    <p class="laden">Lade Daten …</p>
  </main>

  <div class="sheet-huelle" id="sheet-huelle" hidden>
    <div class="sheet-hintergrund" data-schliessen></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titel" id="sheet"></section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
